apiVersion: v1
kind: Service
metadata:
  name: llm-gpu-service
  namespace: ai
  labels:
    app.kubernetes.io/name: llm-gpu-service
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  ports:
    - name: http-unified-gateway
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llm-gpu-service-endpoint
  namespace: ai
  labels:
    kubernetes.io/service-name: llm-gpu-service
addressType: IPv4
ports:
  - name: http-unified-gateway
    port: 8088
    protocol: TCP
endpoints:
  - addresses:
      - "192.168.11.15"  # WSL2 GPU Host LAN IP
    conditions:
      ready: true
